name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Push novo na mesma ref cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint / Format / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # Tag exata: o astral-sh/setup-uv só publica tag móvel de major até v7.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # A CLI é distribuída como pacote: o console script precisa funcionar de fato.
      - name: Smoke do console script
        run: uv run hello-cli hello --name CI
