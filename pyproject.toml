[project]
name = "desenrolai-cli-template"
version = "0.1.0"
description = "Template: CLI Python 3.13"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
hello-cli = "cli_template.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# S = flake8-bandit (segurança), I = isort (ordem de import), B = bugbear, SIM = simplify.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest usa `assert`; S101 não se aplica a teste.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.coverage.report]
# O guard de execução direta só roda fora do pytest.
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short --cov=cli_template --cov-report=term-missing --cov-fail-under=90"
